{% extends "base.html" %}
{% block title %}{{ "Editar" if cobranca else "Nova" }} Cobrança{% endblock %}

{% block content %}
<div class="form-card">
    <h1>{{ "Editar Cobrança" if cobranca else "Nova Cobrança" }}</h1>
    <form method="post">
        <div class="form-grid">
            <div class="form-field full">
                <label>Cliente</label>
                <input type="text" name="cliente" value="{{ cobranca['cliente'] if cobranca else '' }}" required>
            </div>

            <div class="form-field full">
                <label>Descrição</label>
                <input type="text" name="descricao" placeholder="Ex: Mensalidade de setembro"
                       value="{{ cobranca['descricao'] if cobranca else '' }}" required>
            </div>

            <div class="form-field">
                <label>Valor (R$)</label>
                <input type="number" step="0.01" min="0.01" name="valor"
                       value="{{ cobranca['valor'] if cobranca else '' }}" required>
            </div>

            <div class="form-field">
                <label>Forma de pagamento</label>
                <select name="forma_pagamento" required>
                    <option value="">Selecione</option>
                    {% for f in formas %}
                        <option value="{{ f }}" {% if cobranca and cobranca['forma_pagamento'] == f %}selected{% endif %}>{{ f }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-field">
                <label>Vencimento</label>
                <input type="date" name="data_vencimento"
                       value="{{ cobranca['data_vencimento'] if cobranca else hoje }}" required>
            </div>

            <div class="form-field">
                <label>Status</label>
                <select name="status">
                    {% for s in status_opcoes %}
                        <option value="{{ s }}" {% if cobranca and cobranca['status'] == s %}selected{% endif %}>{{ s|capitalize }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-field">
                <label>Data de pagamento (se já pago)</label>
                <input type="date" name="data_pagamento"
                       value="{{ cobranca['data_pagamento'] if cobranca and cobranca['data_pagamento'] else '' }}">
            </div>

            <div class="form-field full">
                <label>Observações</label>
                <textarea name="observacoes" rows="3">{{ cobranca['observacoes'] if cobranca and cobranca['observacoes'] else '' }}</textarea>
            </div>

            <div class="form-actions">
                <a href="{{ url_for('index') }}" class="btn btn-secondary">Cancelar</a>
                <button type="submit" class="btn btn-primary">Salvar</button>
            </div>
        </div>
    </form>
</div>
{% endblock %}
