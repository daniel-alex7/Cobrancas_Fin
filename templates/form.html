{% extends "base.html" %}
{% block title %}{{ "Editar" if lancamento else "Novo" }} Lançamento{% endblock %}

{% block content %}
<div class="card p-4" style="max-width: 600px; margin: 0 auto;">
    <h4 class="mb-3">{{ "Editar" if lancamento else "Novo" }} Lançamento</h4>
    <form method="post">
        <div class="mb-3">
            <label class="form-label">Data</label>
            <input type="date" name="data" class="form-control"
                   value="{{ lancamento['data'] if lancamento else hoje }}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Descrição</label>
            <input type="text" name="descricao" class="form-control"
                   value="{{ lancamento['descricao'] if lancamento else '' }}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Categoria</label>
            <input type="text" name="categoria" class="form-control"
                   placeholder="Ex: Salário, Aluguel, Alimentação"
                   value="{{ lancamento['categoria'] if lancamento else '' }}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Tipo</label>
            <select name="tipo" class="form-select" required>
                <option value="">Selecione</option>
                <option value="receita" {% if lancamento and lancamento['tipo'] == 'receita' %}selected{% endif %}>Receita</option>
                <option value="despesa" {% if lancamento and lancamento['tipo'] == 'despesa' %}selected{% endif %}>Despesa</option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Valor (R$)</label>
            <input type="number" step="0.01" min="0.01" name="valor" class="form-control"
                   value="{{ lancamento['valor'] if lancamento else '' }}" required>
        </div>

        <div class="d-flex justify-content-between">
            <a href="{{ url_for('index') }}" class="btn btn-outline-secondary">Cancelar</a>
            <button type="submit" class="btn btn-primary">Salvar</button>
        </div>
    </form>
</div>
{% endblock %}
