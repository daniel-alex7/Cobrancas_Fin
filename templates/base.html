<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Cobranças Fin{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="topbar">
        <a class="brand" href="{{ url_for('index') }}">
            <span class="dot"></span> Cobranças Fin
        </a>
        <nav class="nav-links">
            <a href="{{ url_for('index') }}" class="{{ 'active' if request.endpoint == 'index' else '' }}">Cobranças</a>
            <a href="{{ url_for('servicos') }}" class="{{ 'active' if request.endpoint and request.endpoint.startswith('servico') else '' }}">Precificação</a>
            <a href="{{ url_for('configuracoes') }}" class="{{ 'active' if request.endpoint == 'configuracoes' else '' }}">Configurações</a>
        </nav>
    </div>

    <div class="wrap">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for categoria, msg in messages %}
                    <div class="flash flash-{{ categoria }}">{{ msg }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </div>
</body>
</html>
