{% extends "base.html" %}
{% block title %}Configurações{% endblock %}

{% block content %}
<div class="form-card">
    <h1>Configurações Padrão</h1>
    <p class="hint" style="margin-top: -10px; margin-bottom: 18px;">
        Esses valores são usados para pré-preencher automaticamente cada novo serviço.
        Você ainda pode ajustar caso a caso ao cadastrar um serviço.
    </p>
    <form method="post">
        <div class="form-grid">
            <div class="form-field">
                <label>Valor padrão da sua hora (R$)</label>
                <input type="number" step="0.01" min="0" name="valor_hora" value="{{ config['valor_hora'] }}" required>
            </div>

            <div class="form-field">
                <label>Valor padrão por km rodado (R$)</label>
                <input type="number" step="0.01" min="0" name="valor_km" value="{{ config['valor_km'] }}" required>
            </div>

            <div class="form-field full">
                <label>Margem de lucro padrão (%)</label>
                <input type="number" step="1" min="0" name="margem_lucro" value="{{ config['margem_lucro'] }}" required>
            </div>

            <div class="form-actions">
                <a href="{{ url_for('servicos') }}" class="btn btn-secondary">Voltar</a>
                <button type="submit" class="btn btn-primary">Salvar padrões</button>
            </div>
        </div>
    </form>
</div>
{% endblock %}
